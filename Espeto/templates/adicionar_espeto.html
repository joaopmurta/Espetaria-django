{% extends "base.html" %}

{% block title %}Adicionar espeto | Espetaria{% endblock %}

{% block content %}
    <div class="page-heading">
        <a class="back-link" href="{% url 'painel_espetos' %}" aria-label="Voltar para os espetos" title="Voltar">←</a>
        <div>
            <h1>Adicionar espeto</h1>
            <p>Inclua um novo item no cardápio.</p>
        </div>
    </div>

    <section class="form-card">
        <form method="post">
            {% csrf_token %}
            <p><label for="nome">Nome</label><input type="text" id="nome" name="nome" required></p>
            <p><label for="tipo">Tipo</label><input type="text" id="tipo" name="tipo" required></p>
            <p><label for="preco">Preço</label><input type="text" id="preco" name="preco" inputmode="decimal" required></p>
            <div class="form-actions">
                <button type="submit">Salvar espeto</button>
                <a class="back-link" href="{% url 'painel_espetos' %}" aria-label="Cancelar e voltar" title="Cancelar">←</a>
            </div>
        </form>
    </section>
{% endblock %}
