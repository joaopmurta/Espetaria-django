{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Espetaria{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'Garcom/css/app.css' %}">
</head>
<body>
    <div id="hud-espetaria" class="hud" role="status" aria-label="Resumo dos pedidos">
        <div class="hud-badge">Em espera <span id="hud-count-espera" class="hud-count bg-espera">0</span></div>
        <div class="hud-badge">Em preparo <span id="hud-count-preparo" class="hud-count bg-preparo">0</span></div>
        <div class="hud-badge">Pronto <span id="hud-count-pronto" class="hud-count bg-pronto">0</span></div>
    </div>

    <header class="site-header">
        <a class="brand" href="{% url 'home' %}">Espetaria</a>
        <div class="header-actions">
            <span class="welcome">Olá, {{ request.user.get_short_name|default:request.user.username }}</span>
            <form action="{% url 'logout' %}" method="post">
                {% csrf_token %}
                <button class="button button-quiet" type="submit">Sair</button>
            </form>
        </div>
    </header>

    <main class="page-shell">
        {% block content %}{% endblock %}
    </main>

    <script src="{% static 'Garcom/js/hud.js' %}" defer></script>
    {% block scripts %}{% endblock %}
</body>
</html>
